# Every third-party dependency in this repository is pinned to an immutable
# identifier: actions to a commit SHA, base images to a manifest digest, crates
# and packages to an exact version. Pinning is what keeps a compromised upstream
# tag from silently entering a release, but a pin left alone is just an old
# version with a security advisory attached. Dependabot is the other half of
# that bargain — it proposes the bumps, review decides on them.
#
# Grouping is deliberate. A patch-level sweep across twenty actions is one
# review; twenty pull requests is twenty chances to rubber-stamp.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The fuzz targets are their own workspace with their own lockfile, so the
  # root cargo entry above does not see them.
  #
  # `direct` is load-bearing, not tidiness. fuzz/ reaches the rest of the tree
  # through path dependencies, so nearly every entry in fuzz/Cargo.lock has its
  # version constraint in the *root* Cargo.toml rather than in fuzz/Cargo.toml.
  # Unrestricted, Dependabot edits that root manifest to satisfy the fuzz
  # lockfile and leaves the root Cargo.lock untouched, which breaks every
  # `--locked` build in the repository on a manifest its lockfile no longer
  # matches. Those crates are the root cargo entry's job; what is genuinely the
  # fuzz workspace's own is arbitrary and libfuzzer-sys.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    groups:
      fuzz-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]

  # Both production Dockerfiles live here; this keeps the digest pins current.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/OpenElementsLabs/record-store/security/advisories/new
    about: >-
      Never in a public issue. This opens a private advisory visible only to you
      and the maintainers. See SECURITY.md.
  - name: Documentation
    url: https://openelementslabs.github.io/record-store/
    about: Installation, configuration, deployment, security, and reference.
  - name: Question or idea
    url: https://github.com/OpenElementsLabs/record-store/discussions
    about: >-
      For anything that is not yet a concrete bug or request. An issue opened as
      a question tends to sit; a discussion gets answered.
